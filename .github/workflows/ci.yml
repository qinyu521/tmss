name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate seed, tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate local assets
        run: npm run assets

      - name: Validate authoritative seed
        run: npm run validate:seed

      - name: Run tests
        run: npm test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
