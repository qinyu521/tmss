name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate seed, tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate local assets
        run: npm run assets

      - name: Validate authoritative seed
        run: npm run validate:seed

      - name: Run tests
        run: npm test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Validate Docker Compose and loopback-only port binding
        run: |
          docker compose config --quiet
          docker compose config --format json | node -e "
            let input = '';
            process.stdin.setEncoding('utf8');
            process.stdin.on('data', (chunk) => input += chunk);
            process.stdin.on('end', () => {
              const config = JSON.parse(input);
              const ports = config.services?.tianming?.ports ?? [];
              const safe = ports.some((port) =>
                port.host_ip === '127.0.0.1' &&
                String(port.published) === '8787' &&
                String(port.target) === '8787'
              );
              if (!safe) {
                console.error('安全错误：Compose 必须只将宿主机 127.0.0.1:8787 映射到容器 8787。');
                process.exit(1);
              }
              console.log('Compose YAML valid; host port is loopback-only.');
            });
          "
